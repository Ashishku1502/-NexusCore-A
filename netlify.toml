# ─────────────────────────────────────────────
#  NexusCore AI — Netlify Configuration
# ─────────────────────────────────────────────

[build]
  # Vite build command (outputs to dist/ at project root)
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Install ALL dependencies including devDependencies (vite, plugin-react, etc.)
  NPM_FLAGS = "--include=dev"
  CI = "false"

# SPA fallback — serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
